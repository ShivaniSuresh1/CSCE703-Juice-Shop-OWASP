<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Juice Shop - Shop</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#effaea; margin:0; }
    .top { background:#fff; border-bottom:2px solid #2b7fc0; padding:.75rem 1.5rem;
           display:flex; justify-content:space-between; align-items:center; }
    .top h1 { font-size:1.2rem; margin:0; color:#2b7fc0; }
    .tag { font-size:.7rem; color:#2b7fc0; font-weight:700; letter-spacing:.05em; }
    #account { font-size:.85rem; }
    #account a { color:#2b7fc0; font-weight:600; }
    #account button { margin-left:.5rem; }
    .wrap { max-width:900px; margin:1.5rem auto; padding:0 1rem; display:flex;
            gap:1.5rem; align-items:flex-start; flex-wrap:wrap; }
    .card { background:#fff; padding:1.5rem; border-radius:12px; border:2px solid #2b7fc0;
            box-shadow:0 4px 16px rgba(0,0,0,.1); }
    .products { flex:1 1 480px; }
    .cart { flex:0 1 260px; }
    h2 { font-size:1rem; margin-top:0; color:#2b7fc0; }
    input { width:100%; padding:.5rem; box-sizing:border-box; border:1px solid #ccc;
            border-radius:6px; }
    table { width:100%; border-collapse:collapse; margin-top:.75rem; font-size:.9rem; }
    th { text-align:left; font-size:.8rem; color:#555; border-bottom:1px solid #ccc; padding:.4rem; }
    td { padding:.5rem .4rem; border-bottom:1px solid #eee; vertical-align:middle; }
    td.desc { color:#666; font-size:.8rem; }
    td.price { white-space:nowrap; }
    button { padding:.35rem .7rem; border:0; border-radius:6px; background:#2b7fc0;
             color:#fff; font-weight:600; cursor:pointer; }
    button:disabled { background:#9bbfdc; cursor:default; }
    .cart ul { list-style:none; padding:0; margin:0; font-size:.9rem; }
    .cart li { display:flex; justify-content:space-between; align-items:center;
               padding:.35rem 0; border-bottom:1px solid #eee; }
    .cart li button { padding:.1rem .45rem; margin:0 .2rem; }
    .total { font-weight:600; margin:.75rem 0; display:flex; justify-content:space-between; }
    #checkout { width:100%; padding:.6rem; }
    .info { font-size:.8rem; color:#555; margin-top:.5rem; min-height:1em; }
    .msg { margin-top:.75rem; font-size:.9rem; min-height:1.2em; }
    .err { color:#c0392b; } .ok { color:#1e8449; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <span class="tag">INSECURE VERSION</span>
      <h1>Juice Shop</h1>
    </div>
    <div id="account"></div>
  </div>

  <div class="wrap">
    <div class="card products">
      <h2>Products</h2>
      <input type="search" id="search" placeholder="Search juices" />
      <div class="info" id="searchInfo"></div>
      <table>
        <thead><tr><th>Juice</th><th>Description</th><th>Price</th><th></th></tr></thead>
        <tbody id="products"></tbody>
      </table>
    </div>

    <div class="card cart">
      <h2>Cart</h2>
      <ul id="cartItems"></ul>
      <div class="total"><span>Total</span><span id="cartTotal">$0.00</span></div>
      <button id="checkout" disabled>Checkout</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <script src="shop.js"></script>
</body>
</html>
