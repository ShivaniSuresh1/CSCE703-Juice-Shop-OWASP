<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- No Content-Security-Policy: inline scripts and injected markup are allowed -->
  <title>Juice Shop - Login</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#effaea; display:flex;
           justify-content:center; align-items:center; min-height:100vh; margin:0; }
    .card { background:#fff; padding:2rem; border-radius:12px; width:340px;
            box-shadow:0 4px 16px rgba(0,0,0,.1); border:2px solid #2b7fc0; }
    h1 { font-size:1.2rem; margin-top:0; color:#2b7fc0; }
    .tag { font-size:.7rem; color:#2b7fc0; font-weight:700; letter-spacing:.05em; }
    label { display:block; margin:.75rem 0 .25rem; font-size:.85rem; }
    input { width:100%; padding:.5rem; box-sizing:border-box; border:1px solid #ccc;
            border-radius:6px; }
    button { margin-top:1rem; width:100%; padding:.6rem; border:0; border-radius:6px;
             background:#2b7fc0; color:#fff; font-weight:600; cursor:pointer; }
    .msg { margin-top:.75rem; font-size:.9rem; min-height:1.2em; }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">INSECURE VERSION</span>
    <h1>Login</h1>
    <!-- No validation attributes; everything is accepted -->
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="text" id="email" />
      <label for="password">Password</label>
      <input type="password" id="password" />
      <button type="submit">Sign in</button>
      <div class="msg" id="msg"></div>
    </form>
    <p style="font-size:.85rem;text-align:center;margin-bottom:0"><a href="shop.html">Browse the shop as a guest →</a></p>
  </div>

  <!-- Inline script allowed because there is no CSP -->
  <script src="app.js"></script>
</body>
</html>
